[package]
name = "pdfcraft"
version = "0.1.0"
description = "PDFCraft Desktop Application"
authors = ["PDFCraft"]
edition = "2021"

[lib]
name = "pdfcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# PDFCraft no Android: salvar na pasta escolhida e "Abrir com" (pasta plugins/)
tauri-plugin-pdfcraft-files = { path = "plugins/tauri-plugin-pdfcraft-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
